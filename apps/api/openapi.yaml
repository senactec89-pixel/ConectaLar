openapi: 3.1.0
info:
  title: ConectaLar API
  version: 0.1.0
  description: Initial technical contract for health and authentication groundwork.
paths:
  /health:
    get:
      operationId: getHealth
      summary: Checks whether the HTTP process is responding
      tags:
        - System
      responses:
        '200':
          description: HTTP process available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        default:
          description: HTTP error with internal details omitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /auth/cadastro:
    post:
      operationId: postAuthCadastro
      summary: Creates a public client, professional, or company account
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthCadastroRequest'
      responses:
        '201':
          description: Account created and access token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Account could not be created with these data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        default:
          description: HTTP error with internal details omitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /auth/login:
    post:
      operationId: postAuthLogin
      summary: Authenticates an existing account
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLoginRequest'
      responses:
        '201':
          description: Access token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        default:
          description: HTTP error with internal details omitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /auth/logout:
    post:
      operationId: postAuthLogout
      summary: Invalidates the current token version for the authenticated account
      tags:
        - Auth
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Session invalidated
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - ok
                properties:
                  ok:
                    type: boolean
        default:
          description: HTTP error with internal details omitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /profissionais:
    get:
      operationId: getProfissionais
      summary: Lists active public professional profiles
      tags:
        - Profissionais
      parameters:
        - name: termo
          in: query
          required: false
          schema:
            type: string
            maxLength: 80
        - name: bairro
          in: query
          required: false
          schema:
            type: string
            maxLength: 80
        - name: categoriaId
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Public professional profiles
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - profissionais
                properties:
                  profissionais:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProfissionalPublico'
        default:
          description: HTTP error with internal details omitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /profissionais/me:
    get:
      operationId: getMeuPerfilProfissional
      summary: Gets the authenticated professional or company profile
      tags:
        - Profissionais
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Authenticated professional profile or null
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - profissional
                properties:
                  profissional:
                    anyOf:
                      - $ref: '#/components/schemas/ProfissionalPublico'
                      - type: 'null'
        default:
          description: HTTP error with internal details omitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    put:
      operationId: putMeuPerfilProfissional
      summary: Creates or updates the authenticated professional or company profile
      tags:
        - Profissionais
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfissionalUpsertRequest'
      responses:
        '200':
          description: Saved professional profile
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - profissional
                properties:
                  profissional:
                    $ref: '#/components/schemas/ProfissionalPublico'
        default:
          description: HTTP error with internal details omitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /profissionais/me/agenda:
    get:
      operationId: getMinhaAgendaProfissional
      summary: Lists monthly accepted appointments and weekly availability
      tags:
        - Profissionais
      security:
        - bearerAuth: []
      parameters:
        - name: mes
          in: query
          required: false
          schema:
            type: string
            pattern: '^\d{4}-\d{2}$'
      responses:
        '200':
          description: Professional agenda for the selected month
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - mes
                  - disponibilidade
                  - atendimentos
                properties:
                  mes:
                    type: string
                  disponibilidade:
                    type: array
                    items:
                      $ref: '#/components/schemas/Disponibilidade'
                  atendimentos:
                    type: array
                    items:
                      $ref: '#/components/schemas/Solicitacao'
        default:
          description: HTTP error with internal details omitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /profissionais/{id}:
    get:
      operationId: getProfissionalById
      summary: Gets one active public professional profile
      tags:
        - Profissionais
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Public professional profile
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - profissional
                properties:
                  profissional:
                    $ref: '#/components/schemas/ProfissionalPublico'
        default:
          description: HTTP error with internal details omitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /profissionais/{id}/verificacao:
    patch:
      operationId: patchProfissionalVerificacao
      summary: Updates the verification seal through an administrative account
      tags:
        - Profissionais
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - verificado
              properties:
                verificado:
                  type: boolean
      responses:
        '200':
          description: Updated professional profile
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - profissional
                properties:
                  profissional:
                    $ref: '#/components/schemas/ProfissionalPublico'
        default:
          description: HTTP error with internal details omitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /categorias:
    get:
      operationId: getCategorias
      summary: Lists active service categories
      tags:
        - Categorias
      responses:
        '200':
          description: Active categories
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - categorias
                properties:
                  categorias:
                    type: array
                    items:
                      $ref: '#/components/schemas/Categoria'
        default:
          description: HTTP error with internal details omitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    post:
      operationId: postCategoria
      summary: Creates a service category through an administrative account
      tags:
        - Categorias
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoriaWriteRequest'
      responses:
        '201':
          description: Created category
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - categoria
                properties:
                  categoria:
                    $ref: '#/components/schemas/Categoria'
        default:
          description: HTTP error with internal details omitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /categorias/admin:
    get:
      operationId: getCategoriasAdmin
      summary: Lists all categories through an administrative account
      tags:
        - Categorias
      security:
        - bearerAuth: []
      responses:
        '200':
          description: All categories
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - categorias
                properties:
                  categorias:
                    type: array
                    items:
                      $ref: '#/components/schemas/Categoria'
        default:
          description: HTTP error with internal details omitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /categorias/{id}:
    patch:
      operationId: patchCategoria
      summary: Updates a service category through an administrative account
      tags:
        - Categorias
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoriaPatchRequest'
      responses:
        '200':
          description: Updated category
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - categoria
                properties:
                  categoria:
                    $ref: '#/components/schemas/Categoria'
        default:
          description: HTTP error with internal details omitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /solicitacoes:
    post:
      operationId: postSolicitacao
      summary: Creates a service request in aguardando_resposta
      tags:
        - Solicitacoes
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitacaoCreateRequest'
      responses:
        '201':
          description: Created service request
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - solicitacao
                properties:
                  solicitacao:
                    $ref: '#/components/schemas/Solicitacao'
        default:
          description: HTTP error with internal details omitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /solicitacoes/me:
    get:
      operationId: getMinhasSolicitacoes
      summary: Lists service requests visible to the authenticated account
      tags:
        - Solicitacoes
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Visible service requests
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - solicitacoes
                properties:
                  solicitacoes:
                    type: array
                    items:
                      $ref: '#/components/schemas/Solicitacao'
        default:
          description: HTTP error with internal details omitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /solicitacoes/{id}:
    get:
      operationId: getSolicitacaoById
      summary: Gets a service request visible to the authenticated account
      tags:
        - Solicitacoes
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SolicitacaoId'
      responses:
        '200':
          description: Service request
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - solicitacao
                properties:
                  solicitacao:
                    $ref: '#/components/schemas/Solicitacao'
        default:
          description: HTTP error with internal details omitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /solicitacoes/{id}/aceitar:
    patch:
      operationId: patchSolicitacaoAceitar
      summary: Provider accepts a pending request and creates an accepted appointment
      tags:
        - Solicitacoes
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SolicitacaoId'
      responses:
        '200':
          $ref: '#/components/responses/SolicitacaoResponse'
        default:
          $ref: '#/components/responses/ApiErrorResponse'
  /solicitacoes/{id}/recusar:
    patch:
      operationId: patchSolicitacaoRecusar
      summary: Provider refuses a pending request
      tags:
        - Solicitacoes
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SolicitacaoId'
      responses:
        '200':
          $ref: '#/components/responses/SolicitacaoResponse'
        default:
          $ref: '#/components/responses/ApiErrorResponse'
  /solicitacoes/{id}/cancelar:
    patch:
      operationId: patchSolicitacaoCancelar
      summary: Client cancels a pending or accepted request
      tags:
        - Solicitacoes
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SolicitacaoId'
      responses:
        '200':
          $ref: '#/components/responses/SolicitacaoResponse'
        default:
          $ref: '#/components/responses/ApiErrorResponse'
  /solicitacoes/{id}/concluir:
    patch:
      operationId: patchSolicitacaoConcluir
      summary: Client confirms conclusion of an accepted request
      tags:
        - Solicitacoes
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SolicitacaoId'
      responses:
        '200':
          $ref: '#/components/responses/SolicitacaoResponse'
        default:
          $ref: '#/components/responses/ApiErrorResponse'
  /admin/painel/auditoria:
    get:
      operationId: getAdminPainelAuditoria
      summary: Lists latest administrative audit events
      tags:
        - Admin
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Administrative audit events
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - eventos
                properties:
                  eventos:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminAuditoriaEvento'
        default:
          $ref: '#/components/responses/ApiErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    SolicitacaoId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  responses:
    SolicitacaoResponse:
      description: Service request
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
              - solicitacao
            properties:
              solicitacao:
                $ref: '#/components/schemas/Solicitacao'
    ApiErrorResponse:
      description: HTTP error with internal details omitted
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    HealthStatus:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          const: ok
    AuthCadastroRequest:
      type: object
      additionalProperties: false
      required:
        - nome
        - email
        - senha
        - tipo
      properties:
        nome:
          type: string
          minLength: 3
          maxLength: 140
        email:
          type: string
          format: email
          maxLength: 180
        telefone:
          type: string
          maxLength: 32
        senha:
          type: string
          minLength: 8
          maxLength: 128
          writeOnly: true
        tipo:
          $ref: '#/components/schemas/UsuarioTipoPublico'
    AuthLoginRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - senha
      properties:
        email:
          type: string
          format: email
        senha:
          type: string
          writeOnly: true
    AuthResponse:
      type: object
      additionalProperties: false
      required:
        - usuario
        - token
      properties:
        usuario:
          $ref: '#/components/schemas/UsuarioPublico'
        token:
          $ref: '#/components/schemas/AuthToken'
    UsuarioPublico:
      type: object
      additionalProperties: false
      required:
        - id
        - nome
        - email
        - telefone
        - tipo
      properties:
        id:
          type: integer
          minimum: 1
        nome:
          type: string
        email:
          type: string
          format: email
        telefone:
          type:
            - string
            - 'null'
        tipo:
          $ref: '#/components/schemas/UsuarioTipo'
    UsuarioTipoPublico:
      type: string
      enum:
        - cliente
        - profissional
        - empresa
    UsuarioTipo:
      type: string
      enum:
        - cliente
        - profissional
        - empresa
        - administrador
    AuthToken:
      type: object
      additionalProperties: false
      required:
        - accessToken
        - tokenType
        - expiresIn
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          const: Bearer
        expiresIn:
          type: integer
          const: 3600
    ProfissionalUpsertRequest:
      type: object
      additionalProperties: false
      required:
        - descricao
        - bairro
        - servicos
      properties:
        descricao:
          type: string
          minLength: 20
          maxLength: 280
        bairro:
          type: string
          minLength: 2
          maxLength: 120
        precoInicial:
          type:
            - number
            - 'null'
          minimum: 0
        servicos:
          type: array
          maxItems: 12
          items:
            type: object
            additionalProperties: false
            required:
              - nome
            properties:
              nome:
                type: string
                minLength: 2
                maxLength: 90
              categoriaId:
                type:
                  - integer
                  - 'null'
                minimum: 1
              precoInicial:
                type:
                  - number
                  - 'null'
                minimum: 0
    ProfissionalPublico:
      type: object
      additionalProperties: false
      required:
        - id
        - usuarioId
        - nome
        - tipo
        - descricao
        - bairro
        - precoInicial
        - verificado
        - servicos
      properties:
        id:
          type: integer
          minimum: 1
        usuarioId:
          type: integer
          minimum: 1
        nome:
          type: string
        tipo:
          $ref: '#/components/schemas/UsuarioTipo'
        descricao:
          type: string
        bairro:
          type: string
        precoInicial:
          type:
            - number
            - 'null'
        verificado:
          type: boolean
        servicos:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - id
              - nome
              - categoria
              - precoInicial
            properties:
              id:
                type: integer
                minimum: 1
              nome:
                type: string
              categoria:
                anyOf:
                  - $ref: '#/components/schemas/CategoriaResumo'
                  - type: 'null'
              precoInicial:
                type:
                  - number
                  - 'null'
    Categoria:
      type: object
      additionalProperties: false
      required:
        - id
        - nome
        - ativo
      properties:
        id:
          type: integer
          minimum: 1
        nome:
          type: string
        ativo:
          type: boolean
    CategoriaResumo:
      type: object
      additionalProperties: false
      required:
        - id
        - nome
      properties:
        id:
          type: integer
          minimum: 1
        nome:
          type: string
    CategoriaWriteRequest:
      type: object
      additionalProperties: false
      required:
        - nome
      properties:
        nome:
          type: string
          minLength: 2
          maxLength: 80
        ativo:
          type: boolean
    CategoriaPatchRequest:
      type: object
      additionalProperties: false
      properties:
        nome:
          type: string
          minLength: 2
          maxLength: 80
        ativo:
          type: boolean
    SolicitacaoCreateRequest:
      type: object
      additionalProperties: false
      required:
        - profissionalId
        - descricao
        - bairroAtendimento
        - dataServico
        - horarioServico
      properties:
        profissionalId:
          type: integer
          minimum: 1
        categoriaId:
          type:
            - integer
            - 'null'
          minimum: 1
        enderecoId:
          type:
            - integer
            - 'null'
          minimum: 1
        descricao:
          type: string
          minLength: 10
          maxLength: 600
        bairroAtendimento:
          type: string
          minLength: 2
          maxLength: 120
        dataServico:
          type: string
          format: date
        horarioServico:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
    Solicitacao:
      type: object
      additionalProperties: false
      required:
        - id
        - status
        - descricao
        - bairroAtendimento
        - enderecoId
        - enderecoProtegido
        - enderecoCompletoLiberado
        - enderecoAtendimento
        - dataServico
        - horarioServico
        - precoInicial
        - cliente
        - profissional
        - categoria
        - criadoEm
        - atualizadoEm
      properties:
        id:
          type: integer
          minimum: 1
        status:
          $ref: '#/components/schemas/SolicitacaoStatus'
        descricao:
          type: string
        bairroAtendimento:
          type: string
        enderecoId:
          type:
            - integer
            - 'null'
          minimum: 1
        enderecoProtegido:
          type: boolean
        enderecoCompletoLiberado:
          type: boolean
        enderecoAtendimento:
          anyOf:
            - $ref: '#/components/schemas/EnderecoAtendimento'
            - type: 'null'
        dataServico:
          type: string
          format: date
        horarioServico:
          type: string
        precoInicial:
          type:
            - number
            - 'null'
        cliente:
          type: object
          additionalProperties: false
          required:
            - id
            - nome
          properties:
            id:
              type: integer
              minimum: 1
            nome:
              type: string
        profissional:
          type: object
          additionalProperties: false
          required:
            - id
            - usuarioId
            - nome
            - verificado
          properties:
            id:
              type: integer
              minimum: 1
            usuarioId:
              type: integer
              minimum: 1
            nome:
              type: string
            verificado:
              type: boolean
        categoria:
          anyOf:
            - $ref: '#/components/schemas/CategoriaResumo'
            - type: 'null'
        criadoEm:
          type: string
          format: date-time
        atualizadoEm:
          type: string
          format: date-time
    SolicitacaoStatus:
      type: string
      enum:
        - aguardando_resposta
        - aceita_agendada
        - recusada
        - cancelada
        - conclusao_confirmada
    Disponibilidade:
      type: object
      additionalProperties: false
      required:
        - id
        - diaSemana
        - horaInicio
        - horaFim
        - ativo
      properties:
        id:
          type: integer
          minimum: 1
        diaSemana:
          type: integer
          minimum: 0
          maximum: 6
        horaInicio:
          type: string
        horaFim:
          type: string
        ativo:
          type: boolean
    EnderecoAtendimento:
