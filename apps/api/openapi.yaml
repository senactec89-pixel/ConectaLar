openapi: 3.1.0
info:
  title: ConectaLar API
  version: 0.1.0
  description: HTTP contract for the routes currently implemented by the ConectaLar API.
paths:
  /profissionais/me/habilitacao:
    get:
      operationId: getMinhaHabilitacao
      summary: Returns security prerequisites, separately from document approval
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Own professional or company status; no biometric or criminal data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HabilitacaoResponse'
        '403':
          description: Requires a professional or company account with verified email
  /profissionais/me/habilitacao/identidade:
    post:
      operationId: postIniciarIdentidade
      summary: Starts hosted identity verification with ID ZapSign
      description: Requires explicit user consent. The app receives a validated hosted URL; the provider API key stays server-side. A successful identity check alone never grants eligibility.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [consentimento]
              properties:
                consentimento: { type: boolean, const: true }
      responses:
        '201':
          description: Hosted identity verification created or resumed
          content:
            application/json:
              schema:
                type: object
                properties:
                  identidade: { $ref: '#/components/schemas/IdentidadeProfissional' }
        '503': { description: Provider credentials unavailable or provider request failed; account stays pending }
        '400':
          description: Consent is missing or unexpected fields were supplied
        '403':
          description: Professional or company role required
    get:
      operationId: getStatusIdentidadeProfissional
      summary: Refreshes own hosted identity verification state
      description: Queries the server-side provider while a verification remains pending and exposes no CPF or document details.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Current state; does not authorize service attendance
          content:
            application/json:
              schema:
                type: object
                properties:
                  identidade: { $ref: '#/components/schemas/IdentidadeProfissional' }
        '403': { description: Professional or company role required }
  /profissionais/me/habilitacao/revisao:
    post:
      operationId: postSolicitarRevisaoHabilitacao
      summary: Records an idempotent review request without lifting suspension
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        '201':
          description: Review requested or already pending; no authorization to attend
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HabilitacaoResponse'
        '400':
          description: Unexpected fields
        '404':
          description: Professional profile must be created first
  /admin/profissionais/habilitacoes:
    get:
      operationId: getHabilitacoesAdmin
      summary: Lists eligibility reviews, requiring administrator MFA
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: pagina
          schema: { type: integer, minimum: 1, maximum: 99999, default: 1 }
      responses:
        '200':
          description: Thirty records per page, sorted by profile id
          content:
            application/json:
              schema:
                type: object
                properties:
                  pagina: { type: integer }
                  total: { type: integer }
                  profissionais:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        nome: { type: string }
                        habilitacao: { $ref: '#/components/schemas/HabilitacaoProfissional' }
        '403':
          description: Administrator role and active MFA required
  /admin/profissionais/{id}/habilitacao:
    patch:
      operationId: patchHabilitacaoAdmin
      summary: Audits suspension or review; cannot approve identity or antecedents
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [acao, motivo]
              properties:
                acao: { type: string, enum: [iniciar_analise, suspender, reabrir] }
                motivo: { type: string, enum: [revisao_cadastral, suspeita_fraude, solicitacao_titular] }
      responses:
        '200':
          description: Decision and audit committed atomically; still blocked for attendance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HabilitacaoResponse'
        '403':
          description: Administrator MFA required; self-review forbidden
        '409':
          description: Approval unavailable while integrations and legal policy are pending, or suspended review not reopened
  /health:
    get:
      operationId: getHealth
      summary: Checks whether the HTTP process is responding
      tags:
        - System
      responses:
        '200':
          description: HTTP process available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        default:
          description: HTTP error with internal details omitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /health/live:
    get:
      operationId: getLiveness
      summary: Checks whether the HTTP process is responding, independently of MySQL
      tags: [System]
      responses:
        '200':
          description: HTTP process available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /health/ready:
    get:
      operationId: getReadiness
      summary: Checks runtime configuration and initialized MySQL connectivity with a two-second probe deadline
      tags: [System]
      responses:
        '200':
          description: Business runtime configured and MySQL responding
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status:
                    const: ready
        '503':
          description: Runtime unconfigured, database unavailable, or probe timed out; no dependency details exposed
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status:
                    const: not_ready
  /auth/cadastro:
    post:
      operationId: postAuthCadastro
      summary: Creates a public client, professional, or company account
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthCadastroRequest'
      responses:
        '201':
          description: Account created, access token issued, and e-mail verification code sent when SMTP is configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Account could not be created with these data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        default:
          description: HTTP error with internal details omitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /auth/login:
    post:
      operationId: postAuthLogin
      summary: Authenticates an existing account
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLoginRequest'
      responses:
        '201':
          description: Access token issued, or MFA challenge returned for an admin with MFA enabled
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/AuthResponse'
                  - $ref: '#/components/schemas/AuthMfaChallenge'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        default:
          description: HTTP error with internal details omitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /auth/google:
    post:
      operationId: postAuthGoogle
      summary: Validates a Google ID token and signs in or creates a public account
      description: >-
        The ID token is verified by the API against the configured OAuth audiences.
        A first access without tipo returns cadastroNecessario; repeat the request
        with a public account type and aceitouTermos=true to create the account.
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthGoogleRequest'
      responses:
        '201':
          description: Session, MFA challenge, or first-access registration requirement
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/AuthResponse'
                  - $ref: '#/components/schemas/AuthMfaChallenge'
                  - $ref: '#/components/schemas/AuthGoogleCadastroNecessario'
        '401':
          description: Invalid, expired, or unauthorized Google identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Existing account requires password login before Google linking
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: Google OAuth is not configured on the API
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        default:
          $ref: '#/components/responses/ApiErrorResponse'
  /auth/login/mfa:
    post:
      operationId: postAuthLoginMfa
      summary: Completes administrator login when MFA is required
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthMfaLoginRequest'
      responses:
        '201':
          description: MFA accepted and access token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        default:
          $ref: '#/components/responses/ApiErrorResponse'
  /auth/logout:
    post:
      operationId: postAuthLogout
      summary: Invalidates the current token version for the authenticated account
      tags:
        - Auth
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Session invalidated
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - ok
                properties:
                  ok:
                    type: boolean
        default:
          description: HTTP error with internal details omitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /auth/me/foto:
    put:
      operationId: putAuthMeFoto
      summary: Uploads or replaces the authenticated account profile photo
      tags:
        - Auth
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FotoPerfilUploadRequest'
      responses:
        '200':
          description: Profile photo updated and session user returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        default:
          $ref: '#/components/responses/ApiErrorResponse'
    delete:
      operationId: deleteAuthMeFoto
      summary: Removes the authenticated account profile photo
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profile photo removed and session user returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        default:
          $ref: '#/components/responses/ApiErrorResponse'
  /auth/me/dados:
    patch:
      operationId: patchAuthMeDados
      summary: Updates the authenticated account name and unique phone number
      tags: [Auth]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [nome]
              properties:
                nome: {type: string, minLength: 3, maxLength: 140}
                telefone: {type: [string, 'null'], maxLength: 32}
      responses:
        '200':
          description: Personal data updated and refreshed session returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        default:
          $ref: '#/components/responses/ApiErrorResponse'
  /privacidade/me/exportacao:
    post:
      operationId: postPrivacidadeMeExportacao
      summary: Exports the authenticated data subject's personal data as JSON
      description: Requires the current password. Password hashes, tokens, MFA secrets, and authentication codes are never exported.
      tags:
        - Privacy
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrivacidadeCredencialRequest'
      responses:
        '201':
          description: Personal data export generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivacidadeExportacaoResponse'
        default:
          $ref: '#/components/responses/ApiErrorResponse'
  /privacidade/me/exclusao:
    post:
      operationId: postPrivacidadeMeExclusao
      summary: Anonymizes and deactivates the authenticated account
      description: Requires the current password and the exact confirmation EXCLUIR. Administrators cannot use this route, and accounts with active service requests must resolve them first.
      tags:
        - Privacy
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrivacidadeExclusaoRequest'
      responses:
        '201':
          description: Account deactivated, sessions invalidated, and personal data anonymized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivacidadeExclusaoResponse'
        '409':
          description: The account still has active service requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        default:
          $ref: '#/components/responses/ApiErrorResponse'
  /usuarios/{id}/foto:
    get:
      operationId: getUsuarioFotoPerfil
      summary: Returns a user's public profile photo when available
      tags:
        - Users
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Profile photo bytes
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        default:
          $ref: '#/components/responses/ApiErrorResponse'
  /auth/senha/recuperacao:
    post:
      operationId: postAuthRecuperarSenha
      summary: Starts password recovery without revealing whether an account exists
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '201':
          description: Generic success; devToken contains a 6-digit development-only code only when explicitly enabled outside production
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ok]
                properties:
                  ok:
                    type: boolean
                    const: true
                  devToken:
                    type: string
                    pattern: '^\d{6}$'
                    description: Development-only recovery code; never returned in production.
        default:
          $ref: '#/components/responses/ApiErrorResponse'
  /auth/senha/recuperacao/confirmar:
    post:
      operationId: postAuthConfirmarRecuperacaoSenha
      summary: Confirms password recovery with a valid one-time code
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, token, novaSenha]
              properties:
                email:
                  type: string
                  format: email
                token:
                  type: string
                  pattern: '^\d{6}$'
                novaSenha:
                  type: string
                  minLength: 8
                  maxLength: 128
                  writeOnly: true
      responses:
        '201':
          $ref: '#/components/responses/OkResponse'
        default:
          $ref: '#/components/responses/ApiErrorResponse'
  /auth/email/verificacao:
    get:
      operationId: getAuthEmailVerificacao
      summary: Returns e-mail verification status for the authenticated account
      tags:
        - Auth
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current e-mail verification status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthEmailVerificacaoStatus'
        default:
          $ref: '#/components/responses/ApiErrorResponse'
  /auth/email/verificacao/enviar:
    post:
      operationId: postAuthEmailVerificacaoEnviar
      summary: Sends a new six-digit e-mail verification code to the authenticated account
      tags:
        - Auth
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Verification code requested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthEmailVerificacaoEnvio'
        default:
          $ref: '#/components/responses/ApiErrorResponse'
  /auth/email/verificacao/confirmar:
    post:
      operationId: postAuthEmailVerificacaoConfirmar
      summary: Confirms the authenticated account e-mail with a valid six-digit code
      tags:
        - Auth
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthEmailVerificacaoConfirmarRequest'
      responses:
        '201':
          description: E-mail confirmed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthEmailVerificacaoStatus'
        default:
          $ref: '#/components/responses/ApiErrorResponse'
  /auth/mfa/admin:
    get:
      operationId: getAuthMfaAdmin
      summary: Returns MFA status for the authenticated administrator
      tags:
        - Auth
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current MFA status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthMfaStatus'
        default:
          $ref: '#/components/responses/ApiErrorResponse'
  /auth/mfa/admin/setup:
    post:
      operationId: postAuthMfaAdminSetup
      summary: Starts TOTP setup for the authenticated administrator
      tags:
        - Auth
      security:
        - bearerAuth: []
      responses:
        '201':
          description: TOTP secret and otpauth URL for enrollment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthMfaSetup'
        default:
          $ref: '#/components/responses/ApiErrorResponse'
  /auth/mfa/admin/confirmar:
    post:
      operationId: postAuthMfaAdminConfirmar
      summary: Confirms TOTP setup for the authenticated administrator
      tags:
        - Auth
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthMfaCodigoRequest'
      responses:
        '201':
          $ref: '#/components/responses/OkResponse'
        default:
          $ref: '#/components/responses/ApiErrorResponse'
  /auth/mfa/admin/desativar:
    post:
      operationId: postAuthMfaAdminDesativar
      summary: Disables TOTP for the authenticated administrator after password and code confirmation
      tags:
        - Auth
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthMfaDesativarRequest'
      responses:
        '201':
          $ref: '#/components/responses/OkResponse'
        default:
          $ref: '#/components/responses/ApiErrorResponse'
  /auth/senha:
    patch:
      operationId: patchAuthSenha
      summary: Changes the authenticated account password and invalidates existing tokens
      tags:
        - Auth
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [senhaAtual, novaSenha]
              properties:
                senhaAtual:
                  type: string
                  writeOnly: true
                novaSenha:
                  type: string
                  minLength: 8
                  maxLength: 128
                  writeOnly: true
      responses:
        '200':
          $ref: '#/components/responses/OkResponse'
        default:
          $ref: '#/components/responses/ApiErrorResponse'
  /localizacao/cep/{cep}:
    get:
      summary: Consulta um CEP brasileiro e retorna endereco e coordenadas opcionais
      parameters:
        - in: path
          name: cep
          required: true
          schema: {type: string, pattern: '^\\d{8}$'}
      responses:
        '200':
          description: CEP localizado
          content:
            application/json:
              schema:
                type: object
                required: [cep, logradouro, bairro, cidade, uf]
                properties:
                  cep: {type: string}
                  logradouro: {type: string}
                  complemento: {type: string, nullable: true}
                  bairro: {type: string}
                  cidade: {type: string}
                  uf: {type: string}
                  regiao: {type: string, nullable: true}
                  ibge: {type: string, nullable: true}
                  latitude: {type: number, nullable: true}
                  longitude: {type: number, nullable: true}
                  precisao: {type: string, nullable: true}
        '400': {description: CEP invalido ou inexistente}
        '502': {description: Consulta de CEP temporariamente indisponivel}
  /profissionais:
    get:
      operationId: getProfissionais
      summary: Lists active public professional profiles
      tags:
        - Profissionais
      parameters:
        - name: termo
          in: query
          required: false
          schema:
            type: string
            maxLength: 80
        - name: bairro
          in: query
          required: false
          schema:
            type: string
            maxLength: 80
        - name: categoriaId
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: cidade
          in: query
          required: false
          schema:
            type: string
            maxLength: 120
        - name: uf
          in: query
          required: false
          schema:
            type: string
            pattern: '^[A-Za-z]{2}$'
      responses:
        '200':
          description: Public professional profiles
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - profissionais
                properties:
                  profissionais:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProfissionalPublico'
        default:
          description: HTTP error with internal details omitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /profissionais/busca:
    post:
      operationId: postBuscaProfissionaisPorDistancia
      summary: Lists professionals ordered and filtered by transient location
      description: Coordinates are used only for this request and are not persisted. Public professional coordinates remain approximate.
      tags:
        - Profissionais
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - latitude
                - longitude
                - raioKm
              properties:
                latitude:
                  type: number
                  minimum: -90
                  maximum: 90
                longitude:
                  type: number
                  minimum: -180
                  maximum: 180
                raioKm:
                  type: integer
                  minimum: 1
                  maximum: 200
                termo:
                  type: string
                  maxLength: 80
                categoriaId:
                  type: integer
                  minimum: 1
      responses:
        '200':
          description: Professionals within both the requested radius and their service area
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - profissionais
                properties:
                  profissionais:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProfissionalPublico'
        default:
          description: HTTP error with internal details omitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /profissionais/me:
    get:
      operationId: getMeuPerfilProfissional
      summary: Gets the authenticated professional or company profile
      tags:
        - Profissionais
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Authenticated professional profile or null
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - profissional
                properties:
                  profissional:
                    anyOf:
                      - $ref: '#/components/schemas/ProfissionalPublico'
                      - type: 'null'
        default:
          description: HTTP error with internal details omitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    put:
      operationId: putMeuPerfilProfissional
      summary: Creates or updates the authenticated professional or company profile
      tags:
        - Profissionais
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfissionalUpsertRequest'
      responses:
        '200':
          description: Saved professional profile
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - profissional
                properties:
                  profissional:
