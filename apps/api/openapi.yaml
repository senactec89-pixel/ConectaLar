            type: integer
            minimum: 1
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/SolicitacaoStatus'
        - name: finalizados
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Administrative service history records
          content:
            application/json:
              schema:
                type: object
                required: [atendimentos]
                properties:
                  atendimentos:
                    type: array
                    items:
                      $ref: '#/components/schemas/AtendimentoHistoricoAdmin'
        default:
          $ref: '#/components/responses/ApiErrorResponse'
  /termos/atuais:
    get:
      operationId: getTermosAtuais
      summary: Gets the currently published terms and privacy notice
      tags: [Termos]
      responses:
        '200':
          description: Published terms
          content:
            application/json:
              schema:
                type: object
                required: [termos]
                properties:
                  termos:
                    $ref: '#/components/schemas/Termos'
        default:
          $ref: '#/components/responses/ApiErrorResponse'
  /termos/aceites/me:
    get:
      operationId: getMeusAceitesTermos
      summary: Lists the authenticated user's terms acceptances
      tags: [Termos]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Acceptance history and current acceptance status
          content:
            application/json:
              schema:
                type: object
                required: [versaoAtual, aceitouVersaoAtual, aceites]
                properties:
                  versaoAtual:
                    type: string
                  aceitouVersaoAtual:
                    type: boolean
                  aceites:
                    type: array
                    items:
                      $ref: '#/components/schemas/AceiteTermos'
        default:
          $ref: '#/components/responses/ApiErrorResponse'
    post:
      operationId: postAceitarTermos
      summary: Records acceptance of the current terms version
      tags: [Termos]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [versao]
              properties:
                versao:
                  type: string
                  minLength: 1
                  maxLength: 40
      responses:
        '201':
          description: Acceptance record and whether it existed already
          content:
            application/json:
              schema:
                type: object
                required: [aceite, jaAceito]
                properties:
                  aceite:
                    $ref: '#/components/schemas/AceiteTermos'
                  jaAceito:
                    type: boolean
        default:
          $ref: '#/components/responses/ApiErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    SolicitacaoId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  responses:
    AvaliacoesPublicadasResponse:
      description: Avaliações aprovadas e resumo agregado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AvaliacoesPublicadas'
    OkResponse:
      description: Operation completed successfully
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [ok]
            properties:
              ok:
                type: boolean
                const: true
    SolicitacaoResponse:
      description: Service request
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
              - solicitacao
            properties:
              solicitacao:
                $ref: '#/components/schemas/Solicitacao'
    ApiErrorResponse:
      description: HTTP error with internal details omitted
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    HabilitacaoResponse:
      type: object
      required: [habilitacao]
      properties:
        habilitacao: { $ref: '#/components/schemas/HabilitacaoProfissional' }
    HabilitacaoProfissional:
      type: object
      required: [estado, podeAtender, documentoAnalisado, etapas, mensagem, revisaoSolicitadaEm]
      properties:
        estado: { type: string, enum: [pendente, em_analise, suspenso] }
        podeAtender: { type: boolean, const: false }
        documentoAnalisado: { type: boolean }
        mensagem: { type: string }
        revisaoSolicitadaEm: { type: [string, 'null'], format: date-time }
        etapas:
          type: array
          items:
            type: object
            properties:
              codigo: { type: string, enum: [perfil, email, telefone, identidade, antecedentes, aprovacao] }
              status: { type: string, enum: [cadastrado, confirmado, pendente, em_analise, suspenso, aguardando_integracao, aguardando_politica, revisao_necessaria] }
    IdentidadeProfissional:
      type: object
      required: [estado, disponivel, url, expiraEm, resolvidaEm]
      properties:
        estado: { type: string, enum: [nao_iniciada, iniciando, pendente, confirmada, revisao_necessaria, expirada, falha] }
        disponivel: { type: boolean }
        url: { type: [string, 'null'], format: uri }
        expiraEm: { type: [string, 'null'], format: date-time }
        resolvidaEm: { type: [string, 'null'], format: date-time }
    HealthStatus:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          const: ok
    AuthCadastroRequest:
      type: object
      additionalProperties: false
      required:
        - nome
        - email
        - senha
        - tipo
      properties:
        nome:
          type: string
          minLength: 3
          maxLength: 140
        email:
          type: string
          format: email
          maxLength: 180
        telefone:
          type: string
          maxLength: 32
        senha:
          type: string
          minLength: 8
          maxLength: 128
          writeOnly: true
        tipo:
          $ref: '#/components/schemas/UsuarioTipoPublico'
    PrivacidadeCredencialRequest:
      type: object
      additionalProperties: false
      required:
        - senhaAtual
      properties:
        senhaAtual:
          type: string
          minLength: 8
          maxLength: 200
          writeOnly: true
    PrivacidadeExclusaoRequest:
      type: object
      additionalProperties: false
      required:
        - senhaAtual
        - confirmacao
      properties:
        senhaAtual:
          type: string
          minLength: 8
          maxLength: 200
          writeOnly: true
        confirmacao:
          type: string
          const: EXCLUIR
    PrivacidadeExportacaoResponse:
      type: object
      additionalProperties: false
      required:
        - nomeArquivo
        - mimeType
        - dados
      properties:
        nomeArquivo:
          type: string
        mimeType:
          type: string
          const: application/json
        dados:
          type: object
          description: Versioned data-subject export. Sensitive authentication secrets are omitted.
          additionalProperties: true
    PrivacidadeExclusaoResponse:
      type: object
      additionalProperties: false
      required:
        - ok
        - contaExcluida
        - message
      properties:
        ok:
          type: boolean
          const: true
        contaExcluida:
          type: boolean
          const: true
        message:
          type: string
    AuthLoginRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - senha
      properties:
        email:
          type: string
          format: email
        senha:
          type: string
          writeOnly: true
    AuthGoogleRequest:
      type: object
      additionalProperties: false
      required:
        - idToken
      properties:
        idToken:
          type: string
          maxLength: 12000
          writeOnly: true
        tipo:
          $ref: '#/components/schemas/UsuarioTipoPublico'
        aceitouTermos:
          type: boolean
          description: Required and true only when tipo is sent to create a new account.
        senha:
          type: string
          minLength: 8
          maxLength: 128
          writeOnly: true
          description: ConectaLar recovery password required only when tipo is sent for first registration.
    AuthGoogleCadastroNecessario:
      type: object
      additionalProperties: false
      required:
        - cadastroNecessario
        - perfilGoogle
      properties:
        cadastroNecessario:
          type: boolean
          const: true
        perfilGoogle:
          type: object
          additionalProperties: false
          required:
            - nome
            - email
          properties:
            nome:
              type: string
            email:
              type: string
              format: email
    AuthResponse:
      type: object
      additionalProperties: false
      required:
        - usuario
        - token
      properties:
        usuario:
          $ref: '#/components/schemas/UsuarioPublico'
        token:
          $ref: '#/components/schemas/AuthToken'
        emailVerificationRequired:
          type: boolean
          description: Returned on registration when the account still needs e-mail confirmation.
        emailVerificationSent:
          type: boolean
          description: Indicates whether SMTP delivery was attempted successfully for the verification code.
        devCode:
          type: string
          description: Development-only e-mail verification code; never returned in production.
        contaCriada:
          type: boolean
          description: Present on Google authentication to indicate a new local account.
        contaVinculada:
          type: boolean
          description: Present when Google was safely linked to an existing account.
    AuthEmailVerificacaoStatus:
      type: object
      additionalProperties: false
      required:
        - emailVerificado
      properties:
        emailVerificado:
          type: boolean
    AuthEmailVerificacaoEnvio:
      type: object
      additionalProperties: false
      required:
        - ok
        - emailVerificado
      properties:
        ok:
          type: boolean
          const: true
        emailVerificado:
          type: boolean
        emailVerificationSent:
          type: boolean
        devCode:
          type: string
          description: Development-only e-mail verification code; never returned in production.
    AuthEmailVerificacaoConfirmarRequest:
      type: object
      additionalProperties: false
      required:
        - codigo
      properties:
        codigo:
          type: string
          pattern: '^\d{6}$'
    AuthMfaChallenge:
      type: object
      additionalProperties: false
      required:
        - mfaRequired
        - mfaToken
        - expiresIn
      properties:
        mfaRequired:
          type: boolean
          const: true
        mfaToken:
          type: string
        expiresIn:
          type: integer
          const: 300
    AuthMfaLoginRequest:
      type: object
      additionalProperties: false
      required:
        - mfaToken
        - codigo
      properties:
        mfaToken:
          type: string
        codigo:
          type: string
          pattern: '^\d{6}$'
    AuthMfaCodigoRequest:
      type: object
      additionalProperties: false
      required:
        - codigo
      properties:
        codigo:
          type: string
          pattern: '^\d{6}$'
    AuthMfaDesativarRequest:
      type: object
      additionalProperties: false
      required:
        - senhaAtual
        - codigo
      properties:
        senhaAtual:
          type: string
          writeOnly: true
        codigo:
          type: string
          pattern: '^\d{6}$'
    AuthMfaStatus:
      type: object
      additionalProperties: false
      required:
        - mfaAtivo
      properties:
        mfaAtivo:
          type: boolean
    AuthMfaSetup:
      type: object
      additionalProperties: false
      required:
        - secret
        - otpauthUrl
      properties:
        secret:
          type: string
        otpauthUrl:
          type: string
    UsuarioPublico:
      type: object
      additionalProperties: false
      required:
        - id
        - nome
        - email
        - emailVerificado
        - telefone
        - tipo
        - fotoPerfilUrl
        - googleVinculado
      properties:
        id:
          type: integer
          minimum: 1
        nome:
          type: string
        email:
          type: string
          format: email
        emailVerificado:
          type: boolean
        telefone:
          type:
            - string
            - 'null'
        tipo:
          $ref: '#/components/schemas/UsuarioTipo'
        fotoPerfilUrl:
          type:
            - string
            - 'null'
          description: Relative API path for the public profile photo, when present.
        googleVinculado:
          type: boolean
    UsuarioTipoPublico:
      type: string
      enum:
        - cliente
        - profissional
        - empresa
    UsuarioTipo:
      type: string
      enum:
        - cliente
        - profissional
        - empresa
        - administrador
    AuthToken:
      type: object
      additionalProperties: false
      required:
        - accessToken
        - tokenType
        - expiresIn
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          const: Bearer
        expiresIn:
          type: integer
          const: 3600
    ProfissionalUpsertRequest:
      type: object
      additionalProperties: false
      required:
        - descricao
        - bairro
        - servicos
      properties:
        descricao:
          type: string
          minLength: 20
          maxLength: 280
        bairro:
          type: string
          minLength: 2
          maxLength: 120
        precoInicial:
          type:
            - number
            - 'null'
          minimum: 0
          maximum: 99999999.99
        servicos:
          type: array
          maxItems: 12
          items:
            $ref: '#/components/schemas/ServicoProfissionalInput'
    ProfissionalPublico:
      type: object
      additionalProperties: false
      required:
        - id
        - usuarioId
        - nome
        - tipo
        - descricao
        - bairro
        - cidade
        - uf
        - raioAtendimentoKm
        - latitudeAproximada
        - longitudeAproximada
        - precoInicial
        - verificado
        - fotoPerfilUrl
        - servicos
        - notaMedia
        - quantidadeAvaliacoes
      properties:
        id:
          type: integer
          minimum: 1
        usuarioId:
          type: integer
          minimum: 1
        nome:
          type: string
        tipo:
          $ref: '#/components/schemas/UsuarioTipo'
        descricao:
          type: string
        bairro:
          type: string
        cidade:
          type: [string, 'null']
        uf:
          type: [string, 'null']
        raioAtendimentoKm:
          type: integer
          minimum: 1
          maximum: 200
        latitudeAproximada:
          type: [number, 'null']
          minimum: -90
          maximum: 90
          description: Approximate public latitude rounded by the API.
        longitudeAproximada:
          type: [number, 'null']
          minimum: -180
          maximum: 180
          description: Approximate public longitude rounded by the API.
        distanciaKm:
          type: [number, 'null']
          minimum: 0
          description: Present in search responses when a reference location is supplied.
        precoInicial:
          type:
            - number
            - 'null'
        verificado:
          type: boolean
          description: Document review only, not identity proof or authorization to attend.
        podeReceberSolicitacoes:
          type: boolean
          const: false
          description: False until the external verification and eligibility workflow is implemented and approved.
        fotoPerfilUrl:
          type:
            - string
            - 'null'
          description: Relative API path for the public profile photo, when present.
        servicos:
          type: array
          items:
            $ref: '#/components/schemas/ServicoProfissional'
        notaMedia:
          type: [number, 'null']
          minimum: 1
          maximum: 5
          description: Média somente das avaliações aprovadas; null quando não há avaliações.
        quantidadeAvaliacoes:
          type: integer
          minimum: 0
    FotoPerfilUploadRequest:
      type: object
      additionalProperties: false
      required:
        - arquivoBase64
        - mimeType
      properties:
        arquivoBase64:
          type: string
          contentEncoding: base64
          description: JPEG, PNG, or WebP file encoded as Base64. Maximum decoded size is 2 MB.
        mimeType:
          type: string
          enum:
            - image/jpeg
            - image/png
            - image/webp
        nomeArquivo:
          type: string
          maxLength: 180
    Categoria:
      type: object
      additionalProperties: false
      required:
        - id
        - nome
        - icone
        - ativo
      properties:
        id:
          type: integer
          minimum: 1
        nome:
          type: string
        icone:
          type: string
          description: Controlled Material icon identifier selected by an administrator.
        ativo:
          type: boolean
    CategoriaResumo:
      type: object
      additionalProperties: false
      required:
        - id
        - nome
      properties:
        id:
          type: integer
          minimum: 1
        nome:
          type: string
    CategoriaWriteRequest:
      type: object
      additionalProperties: false
      required:
        - nome
      properties:
        nome:
          type: string
          minLength: 2
          maxLength: 80
        icone:
          type: string
          default: home_repair
        ativo:
          type: boolean
    CategoriaPatchRequest:
      type: object
      additionalProperties: false
      properties:
        nome:
          type: string
          minLength: 2
          maxLength: 80
        icone:
          type: string
        ativo:
          type: boolean
    DocumentoVerificacaoEnvioRequest:
      type: object
      additionalProperties: false
      required:
        - tipoDocumento
      properties:
        tipoDocumento:
          type: string
          minLength: 3
          maxLength: 60
        referenciaArquivo:
          type:
            - string
            - 'null'
          description: Internal private reference, never a public URL.
          maxLength: 180
        arquivoBase64:
          type:
            - string
            - 'null'
          description: Base64 file content, limited to 5 MB after decoding.
        mimeType:
          type:
            - string
            - 'null'
          enum:
            - application/pdf
            - image/jpeg
            - image/png
            - null
        nomeArquivo:
          type:
            - string
            - 'null'
          maxLength: 180
        observacao:
          type:
            - string
            - 'null'
          maxLength: 600
    SolicitacaoCreateRequest:
      type: object
      additionalProperties: false
      required:
        - profissionalId
        - descricao
        - bairroAtendimento
        - dataServico
        - horarioServico
      properties:
        profissionalId:
          type: integer
          minimum: 1
        servicoId:
          type: [integer, 'null']
          minimum: 1
          description: Oferta ativa do profissional; a API deriva categoria, nome e preço inicial desta oferta. Opcional para compatibilidade com pedidos antigos.
        categoriaId:
          type:
            - integer
            - 'null'
          minimum: 1
        enderecoId:
          type:
            - integer
            - 'null'
          minimum: 1
        descricao:
          type: string
          minLength: 10
          maxLength: 600
        bairroAtendimento:
          type: string
          minLength: 2
          maxLength: 120
        dataServico:
          type: string
          format: date
        horarioServico:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
    Solicitacao:
      type: object
      additionalProperties: false
      required:
        - id
        - servicoId
        - nomeServico
        - avaliado
        - status
        - descricao
        - bairroAtendimento
        - enderecoId
        - enderecoProtegido
        - enderecoCompletoLiberado
        - enderecoAtendimento
        - dataServico
        - horarioServico
        - duracaoMinutos
        - intervaloMinutos
        - reagendamento
        - reagendamentos
        - cancelamentoMotivo
        - conclusaoContestacaoMotivo
        - naoComparecimentoMotivo
        - naoComparecimentoPorId
        - eventos
        - precoInicial
        - cliente
        - profissional
        - categoria
        - criadoEm
        - atualizadoEm
      properties:
        id:
          type: integer
          minimum: 1
        servicoId:
          type: [integer, 'null']
          minimum: 1
        nomeServico:
          type: [string, 'null']
          description: Nome da oferta no envio do pedido, preservado após edições.
        avaliado:
          type: boolean
          description: O ator autenticado já enviou sua avaliação deste atendimento, inclusive se ainda não publicada.
        status:
          $ref: '#/components/schemas/SolicitacaoStatus'
        descricao:
          type: string
        bairroAtendimento:
          type: string
        enderecoId:
          type:
            - integer
            - 'null'
          minimum: 1
        enderecoProtegido:
          type: boolean
        enderecoCompletoLiberado:
          type: boolean
        enderecoAtendimento:
          anyOf:
            - $ref: '#/components/schemas/EnderecoAtendimento'
            - type: 'null'
        dataServico:
          type: string
          format: date
        horarioServico:
          type: string
        duracaoMinutos:
          type: integer
          minimum: 15
          maximum: 480
        intervaloMinutos:
          type: integer
          minimum: 0
          maximum: 480
        reagendamento:
          oneOf:
            - $ref: '#/components/schemas/Reagendamento'
            - type: 'null'
        reagendamentos:
          type: array
          items:
            $ref: '#/components/schemas/Reagendamento'
        cancelamentoMotivo:
          type: [string, 'null']
        conclusaoContestacaoMotivo:
          type: [string, 'null']
        naoComparecimentoMotivo:
          type: [string, 'null']
        naoComparecimentoPorId:
          type: [integer, 'null']
          minimum: 1
        eventos:
          type: array
          items:
            $ref: '#/components/schemas/SolicitacaoEvento'
        fusoHorario:
          type: string
          const: America/Sao_Paulo
        precoInicial:
          type:
            - number
            - 'null'
        cliente:
          type: object
          additionalProperties: false
          required:
            - id
            - nome
          properties:
            id:
              type: integer
              minimum: 1
            nome:
              type: string
        profissional:
          type: object
          additionalProperties: false
          required:
            - id
            - usuarioId
            - nome
            - verificado
          properties:
            id:
              type: integer
              minimum: 1
            usuarioId:
              type: integer
              minimum: 1
            nome:
              type: string
            verificado:
              type: boolean
        categoria:
          anyOf:
            - $ref: '#/components/schemas/CategoriaResumo'
            - type: 'null'
        criadoEm:
          type: string
          format: date-time
        atualizadoEm:
          type: string
          format: date-time
    SolicitacaoStatus:
      type: string
      enum:
        - aguardando_resposta
        - aceita_agendada
        - recusada
        - cancelada
        - conclusao_pendente
        - conclusao_contestada
        - nao_comparecimento_informado
        - conclusao_confirmada
    Disponibilidade:
      type: object
      additionalProperties: false
      required:
        - id
        - diaSemana
        - horaInicio
        - horaFim
        - ativo
      properties:
        id:
          type: integer
          minimum: 1
        diaSemana:
          type: integer
          minimum: 0
          maximum: 6
        horaInicio:
          type: string
        horaFim:
          type: string
        ativo:
          type: boolean
    EnderecoAtendimento:
      type: object
      additionalProperties: false
      required:
        - id
        - apelido
        - cep
        - logradouro
        - numero
        - complemento
        - bairro
        - cidade
        - uf
      properties:
        id:
          type: integer
          minimum: 1
        apelido:
          type: string
        cep:
          type:
            - string
            - 'null'
        logradouro:
          type: string
        numero:
          type: string
        complemento:
          type:
            - string
            - 'null'
        bairro:
          type: string
        cidade:
          type: string
        uf:
          type: string
          minLength: 2
          maxLength: 2
    AdminAuditoriaEvento:
      type: object
      additionalProperties: false
      required:
        - id
        - ator
        - acao
        - alvoTipo
        - alvoId
        - detalhe
        - criadoEm
      properties:
        id:
          type: integer
          minimum: 1
        ator:
          type: object
          additionalProperties: false
          required:
            - id
            - nome
            - tipo
          properties:
            id:
              type: integer
              minimum: 1
            nome:
              type: string
            tipo:
              $ref: '#/components/schemas/UsuarioTipo'
        acao:
          type: string
        alvoTipo:
          type: string
        alvoId:
          type: integer
          minimum: 1
        detalhe:
          type:
            - string
            - 'null'
