name: conectalar-homologacao

services:
  db:
    image: mysql:8.4.13
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: conectalar_homologacao
      MYSQL_USER: ${DB_USER:?Defina DB_USER no arquivo .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Defina MYSQL_ROOT_PASSWORD no arquivo .env}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - database
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping --protocol=tcp -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s

  clamav:
    image: clamav/clamav:stable-debian13-slim
    restart: unless-stopped
    volumes:
      - clamav_data:/var/lib/clamav
    networks:
      - scanning

  api:
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      NODE_ENV: production
      CONECTALAR_STAGE: homologacao
      HABILITACAO_MANUAL_HOMOLOGACAO: "true"
      HABILITACAO_MANUAL_LOCAL: "false"
      HOST: 0.0.0.0
      PORT: 3000
      TRUST_PROXY_HOPS: 1
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: conectalar_homologacao
      DB_USER: ${DB_USER:?Defina DB_USER no arquivo .env}
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:?Defina AUTH_TOKEN_SECRET no arquivo .env}
      MFA_SECRET_ENCRYPTION_KEY: ${MFA_SECRET_ENCRYPTION_KEY:?Defina MFA_SECRET_ENCRYPTION_KEY no arquivo .env}
      EMAIL_OUTBOX_ENCRYPTION_KEY: ${EMAIL_OUTBOX_ENCRYPTION_KEY:?Defina EMAIL_OUTBOX_ENCRYPTION_KEY no arquivo .env}
      SMTP_HOST: ${SMTP_HOST:?Defina SMTP_HOST no arquivo .env}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_USER: ${SMTP_USER:?Defina SMTP_USER no arquivo .env}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?Defina SMTP_PASSWORD no arquivo .env}
      SMTP_FROM: ${SMTP_FROM:?Defina SMTP_FROM no arquivo .env}
      SMTP_EHLO_NAME: ${SMTP_EHLO_NAME:-api-homologacao.conectarlar.com}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      GOOGLE_WEB_CLIENT_ID: ${GOOGLE_WEB_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_IDS: ${GOOGLE_OAUTH_CLIENT_IDS:-}
      GOOGLE_MAPS_SERVER_API_KEY: ${GOOGLE_MAPS_SERVER_API_KEY:-}
      FILE_STORAGE_DRIVER: local
      FILE_STORAGE_LOCAL_DIR: /var/lib/conectalar/files
      MALWARE_SCAN_MODE: required
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      CLAMAV_TIMEOUT_MS: 30000
    volumes:
      - api_files:/var/lib/conectalar/files
    expose:
      - "3000"
    networks:
      - database
      - scanning
      - proxy
    depends_on:
      db:
        condition: service_healthy
      clamav:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 45s
    stop_grace_period: 30s

  proxy:
    image: caddy:2.11.9-alpine
    restart: unless-stopped
    environment:
      API_DOMAIN: ${API_DOMAIN:-api-homologacao.conectarlar.com}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - proxy
    depends_on:
      api:
        condition: service_healthy

volumes:
  mysql_data:
  clamav_data:
  api_files:
  caddy_data:
  caddy_config:

networks:
  database:
    internal: true
  scanning:
  proxy:
